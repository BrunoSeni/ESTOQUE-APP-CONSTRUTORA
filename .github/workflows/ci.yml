# Verificação automática: roda em todo PR e em toda atualização da main.
# Confere o código (lint), roda os testes e monta o app (build).
# Se algum passo falhar, o PR fica vermelho e não pode entrar na main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificar:
    name: Verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Conferir o código
        run: npm run lint

      - name: Rodar os testes
        run: npm test

      - name: Montar o app
        run: npm run build
