# Verificação automática: roda em todo PR e em toda atualização da main.
# Enquanto o app ainda não tem código, só confere a estrutura do repositório.
# Quando a tecnologia do app for escolhida, os passos de teste e build entram aqui.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificar:
    name: Verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conferir arquivos básicos
        run: test -f README.md

      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with:
          node-version: 20

      - name: Instalar, testar e montar o app
        if: hashFiles('package.json') != ''
        run: |
          npm ci
          npm test --if-present
          npm run build --if-present
